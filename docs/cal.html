<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>涨跌幅计算器</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
</head>

<body>
  <div class="calculator">
    <div class="header">
      <h1>涨跌幅计算器</h1>
      <button class="settings-btn" id="settingsBtn" title="API配置">
        <div id="apiStatusDot" class="api-active-dot"></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"></path>
        </svg>
      </button>
    </div>

    <div class="top-info-bar">
      <div class="pair-selector-container">
        <div class="pair-selector-row">
          <!-- 产品类型切换 -->
          <div class="inst-type-toggle" id="instTypeToggle">
            <button type="button" class="inst-type-btn active" data-inst-type="SPOT">现货</button>
            <button type="button" class="inst-type-btn" data-inst-type="SWAP">永续合约</button>
          </div>

          <!-- 基础币选择器 (带搜索) -->
          <div class="select-group">
            <label for="baseCcyInput">基础币</label>
            <div class="custom-select-wrapper" id="baseCcyWrapper">
              <input type="text" id="baseCcyInput" value="BTC" placeholder="搜索/输入(如BTC)" autocomplete="off" />
              <ul class="select-options-dropdown" id="baseCcyList" style="display:none;"></ul>
            </div>
          </div>

          <span class="pair-slash">/</span>

          <!-- 计价/结算币选择器 -->
          <div class="select-group">
            <label for="quoteCcySelect">计价币</label>
            <select id="quoteCcySelect" class="quote-select">
              <option value="USDT">USDT</option>
              <option value="USDC">USDC</option>
              <option value="USD">USD</option>
            </select>
          </div>

          <!-- OKX代码预览与兼容输入框 -->
          <div class="symbol-input-wrapper">
            <label for="symbol" class="inst-id-label">OKX代码</label>
            <input type="text" id="symbol" value="BTC-USDT" placeholder="如: BTC-USDT" title="生成的 OKX instId，亦可手动编辑" />
          </div>

          <!-- 热门币种快捷便签 Tag Pills (同一行显示) -->
          <div class="hot-pills-bar" id="hotPillsBar">
            <span class="hot-pill-label">热门:</span>
            <button type="button" class="hot-pill active" data-base="BTC">BTC</button>
            <button type="button" class="hot-pill" data-base="ETH">ETH</button>
            <button type="button" class="hot-pill" data-base="SOL">SOL</button>
            <button type="button" class="hot-pill" data-base="DOGE">DOGE</button>
            <button type="button" class="hot-pill" data-base="XRP">XRP</button>
            <button type="button" class="hot-pill" data-base="PEPE">PEPE</button>
          </div>
        </div>
      </div>

      <div id="priceInfo" style="display:none;" class="price-info-inline">
        <div class="price-item"><span>开盘:</span><strong id="openPrice">-</strong></div>
        <div class="price-item"><span>当前:</span><strong id="currentPrice">-</strong></div>
        <div class="price-item"><span>最高:</span><strong id="highPrice">-</strong></div>
        <div class="price-item"><span>最低:</span><strong id="lowPrice">-</strong></div>
        <div class="price-item"><span>涨跌:</span><strong id="dailyChange">-</strong></div>
        <div class="price-item"><span>费率:</span><strong id="fundingRate">-</strong></div>
      </div>

      <div id="positionInfo" style="display:none;" class="position-info-inline">
        <div class="position-item"><span>方向:</span><strong id="positionSide">-</strong></div>
        <div class="position-item"><span>数量:</span><strong id="positionSize">-</strong></div>
        <div class="position-item"><span>均价:</span><strong id="positionAvgPrice">-</strong></div>
        <div class="position-item"><span>爆仓价:</span><strong id="liquidationPrice" class="negative">-</strong></div>
        <div class="position-item"><span>盈亏:</span><strong id="unrealizedPnl">-</strong></div>
        <div class="position-item"><span>杠杆:</span><strong id="leverage">-</strong></div>
      </div>

      <div id="message" style="display:none;"></div>
    </div>

    <div class="content">
      <div class="top-section">
        <div class="position-calculation">
          <!-- 第一部分：开仓设置 -->
          <div class="section calc-sub-card">
            <div class="card-header">
              <span class="card-step-badge">1</span>
              <h3>开仓设置</h3>
            </div>

            <div class="form-grid">
              <div class="form-group full-width">
                <label>持仓类型</label>
                <div class="pos-type-toggle" id="posTypeToggle">
                  <button type="button" class="pos-type-btn active" data-type="spot">现货</button>
                  <button type="button" class="pos-type-btn" data-type="long">合约 - 做多</button>
                  <button type="button" class="pos-type-btn" data-type="short">合约 - 做空</button>
                </div>
              </div>

              <div class="form-group" id="leverageGroup" style="display: none;">
                <label for="leverageInput">杠杆倍数 (x)</label>
                <input type="number" id="leverageInput" min="1" max="125" value="1" placeholder="如: 10" />
              </div>

              <div class="form-group">
                <label for="holdPrice">持仓价格</label>
                <div class="input-with-button">
                  <input type="number" id="holdPrice" step="0.00000001" placeholder="输入持仓价格" />
                  <button type="button" id="syncPositionPrice" class="sync-btn api-feature-btn" title="同步持仓均价">同步</button>
                </div>
              </div>

              <div class="form-group">
                <label for="holdVsOpenPercent">距开盘价幅度 (%)</label>
                <input type="number" id="holdVsOpenPercent" step="0.01" placeholder="如: +2.50 或 -1.00" />
                <div id="holdVsOpenDiffSubtext" class="input-subtext" style="display: none;"></div>
              </div>

              <div class="form-group">
                <label for="marginInput">保证金 / 投入本金 (USDT)</label>
                <input type="number" id="marginInput" min="0" step="0.01" placeholder="可选填，如: 1000" />
                <div id="estLiquidationSubtext" class="input-subtext" style="display: none;"></div>
              </div>
            </div>
          </div>

          <!-- 第二部分：预期收益计算 -->
          <div class="section calc-sub-card">
            <div class="card-header">
              <span class="card-step-badge">2</span>
              <h3>预期收益计算</h3>
            </div>

            <div class="form-grid">
              <div class="form-group">
                <label for="targetPrice">期望点位（目标价格）</label>
                <input type="number" id="targetPrice" step="0.01" placeholder="目标价格" />
              </div>

              <div class="form-group">
                <label for="targetPercent" id="targetPercentLabel">期望幅度 (%)（相对持仓价）</label>
                <input type="number" id="targetPercent" step="0.01" placeholder="如: 5.50 或 -3.20" />
              </div>

              <div class="form-group">
                <label for="dailyExpectPercent">当日涨跌幅预期 (%)（相对开盘价）</label>
                <input type="number" id="dailyExpectPercent" step="0.01" placeholder="如: 2.50 或 -1.00" />
              </div>

              <div class="form-group full-width" id="pnlResultCard" style="display: none;">
                <div class="pnl-summary-box">
                  <div class="pnl-item">
                    <span class="pnl-label">预估强平爆仓价:</span>
                    <strong id="expectedLiqPriceValue" class="pnl-value negative">-</strong>
                  </div>
                  <div class="pnl-item">
                    <span class="pnl-label">预期收益金额:</span>
                    <strong id="expectedPnlValue" class="pnl-value">+0.00 USDT</strong>
                  </div>
                  <div class="pnl-item">
                    <span class="pnl-label">平仓预估总额:</span>
                    <strong id="expectedTotalValue" class="pnl-value">0.00 USDT</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="bottom-section">
        <div class="history-analysis">
          <div class="section">
            <div class="history-header">
              <h3>历史数据分析</h3>
              <div class="history-controls">
                <label for="historyDays">查询天数</label>
                <select id="historyDays">
                  <option value="7">最近7天 (高精度)</option>
                  <option value="14">最近14天</option>
                  <option value="30">最近30天</option>
                  <option value="60">最近60天</option>
                  <option value="90">最近90天</option>
                </select>
              </div>
            </div>

            <div id="historySummary" style="display:none;"></div>

            <div id="historyResults" style="display:none;">
              <div class="history-results">
                <div id="historyTableContainer">
                  <table id="historyTable" class="display compact" style="width:100%; display:none;">
                    <thead>
                      <tr>
                        <th>日期</th>
                        <th>开盘</th>
                        <th>收盘</th>
                        <th>最高</th>
                        <th>最低</th>
                        <th>振幅</th>
                        <th>成交额</th>
                        <th>持仓量(OI)</th>
                        <th>累计涨跌幅</th>
                      </tr>
                    </thead>
                    <tbody>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="apiModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>欧意API配置</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" placeholder="输入您的API Key" />
        </div>
        <div class="form-group">
          <label for="apiSecret">API Secret</label>
          <input type="password" id="apiSecret" placeholder="输入您的API Secret" />
        </div>
        <div class="form-group">
          <label for="apiPassphrase">API Passphrase</label>
          <input type="password" id="apiPassphrase" placeholder="输入您的API Passphrase" />
        </div>
        <button id="saveApiConfig" class="btn-primary">保存配置</button>
        <button id="clearApiConfig" class="btn-secondary btn-danger">清除配置</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
